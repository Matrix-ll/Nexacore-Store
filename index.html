            },
            {
              "@type": "Question",
              "name": "Do you offer refunds?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Refunds may be available according to our refund policy, especially if a customer is unable to access the purchased digital service."
              }
            }
          ]
        }
      ]
    }
